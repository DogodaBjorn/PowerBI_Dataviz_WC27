/* Layout: a fixed 1920 x 1080 Power BI page, scaled to the window by one transform; a slim builder toolbar above it.
   Tokens: doc 21 section 12 (report) and a dark neutral chrome around the stage (deliberately single-theme). */
:root{
  --canvas:#F3F1EA; --card:#FFFFFF; --night:#12233D; --dusk:#4B5466; --hair:#E3DFD3;
  --blue:#2589D8; --blue-t:#1763A8; --grey:#8E897D; --tang:#E05A22; --burnt:#A63F0E;
  --m1:#F7F5EE; --m2:#C9D0DC; --eyebrow:#A9CDF0; --ice:#EAF2FB;
  --chrome:#1B212B; --chrome-2:#262E3A; --chrome-ink:#EEF0F3; --chrome-mute:#A9B2C0; --chrome-line:#3A4452;
  --ovf:#E5001C; --tight:#E8A200; --slot:#8A3FFC; --moved:#00897B;
  --font:'GI Text','Liberation Sans',Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--chrome)}
body{margin:0;color:var(--chrome-ink);font-family:var(--font);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
/* ---------- builder chrome ---------- */
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;max-width:100%;margin:0 auto 8px}
#bar .id{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-width:0;flex:1 1 320px}
#bar .id b{font-weight:600;font-size:15px;letter-spacing:.01em}
#where{color:var(--chrome-mute);font-variant-numeric:tabular-nums}
#bar .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tb{font:inherit;font-size:13px;color:var(--chrome-ink);background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:6px;padding:6px 12px;cursor:pointer}
.tb:hover{border-color:var(--chrome-mute)}
.tb:focus-visible,#stage button:focus-visible{outline:2px solid #6CB4FF;outline-offset:2px}
.tb[aria-pressed="true"]{background:var(--slot);border-color:var(--slot);color:#fff}
.pill{font-size:12.5px;border-radius:999px;padding:4px 10px;border:1px solid var(--chrome-line);color:var(--chrome-mute);white-space:nowrap}
.pill.bad{background:#3A1218;border-color:#7A1F2B;color:#FFB3BC}
.pill.ok{background:#11301F;border-color:#1F5A38;color:#A6E3BD}
#toast{font-size:12.5px;color:#A6E3BD;min-height:1em}
#audit{max-width:100%;margin:0 auto 10px;border:1px solid var(--chrome-line);border-radius:8px;background:var(--chrome-2)}
#audit summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--chrome-ink)}
#audit .body{padding:0 12px 12px;font-size:13px;color:var(--chrome-mute);overflow-x:auto}
#audit table{border-collapse:collapse;min-width:520px}
#audit th,#audit td{text-align:left;padding:4px 12px 4px 0;border-bottom:1px solid var(--chrome-line);vertical-align:top}
#audit th{color:var(--chrome-ink);font-weight:600}
#audit .r{color:#FF8A96}#audit .a{color:#FFD27A}
#audit h4{margin:12px 0 4px;color:var(--chrome-ink);font-size:13px;font-weight:600}
#copyPanel{max-width:100%;margin:0 auto 10px}
#copyPanel textarea{width:100%;box-sizing:border-box;height:160px;background:#0F141B;color:var(--chrome-ink);border:1px solid var(--chrome-line);border-radius:6px;font:12px/1.4 ui-monospace,Consolas,monospace}
#fit{position:relative;margin:0 auto;overflow:hidden;box-shadow:0 0 0 1px var(--chrome-line)}
/* ---------- the Power BI page ---------- */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--canvas);overflow:hidden;
  font-family:var(--font);color:var(--night);font-size:16px;line-height:1.33;-webkit-font-smoothing:antialiased}
#stage *{box-sizing:border-box}
.mast{position:absolute;left:0;top:0;width:1920px;height:168px;background:var(--night)}
.s{position:absolute;overflow:visible}
.part{position:absolute;left:0;width:100%;overflow:visible}
.c{width:100%;overflow-wrap:normal}
.frame{background:var(--card);border-radius:12px;box-shadow:0 14px 36px rgba(18,35,61,.16)}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:12px}
.logo{display:block;height:40px;width:auto;max-width:100%}
.f16{font-size:16px}.dusk{color:var(--dusk)}.night{color:var(--night)}.sb{font-weight:600}
.eyebrow{font-size:16px;font-weight:600;white-space:normal}.eb1{color:var(--eyebrow)}.eb2{color:var(--m2)}
.hl{font-size:37.333px;font-weight:600;color:var(--m1)}
.sub{font-size:16px;color:var(--m2)}
.ttl{font-size:18.667px;font-weight:600;color:var(--night)}
.head20{font-size:20px;font-weight:600;color:var(--night)}
.kick{font-size:16px;font-weight:600;color:var(--blue-t)}.kick .code{color:var(--night)}
.code{font-weight:600;color:var(--night)}
.kval{font-size:37.333px;font-weight:600;color:var(--night)}
.neg{color:var(--burnt)}
.lnk{font-size:16px;color:var(--night)}
.tag{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:2px 12px 0}
.tag .c{color:var(--night);white-space:normal}.tag .i,.ii{color:var(--tang)}
/* controls: P-2, one family, two sizes, two surfaces */
#stage button{font:inherit;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.btn{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border:1px solid transparent;font-size:16px;line-height:1.33;text-align:center;padding:0}
.btn .c{padding:0 10px;max-width:100%}
.btn.lg{border-radius:8px;font-weight:600}.btn.sm{border-radius:999px;font-weight:400}
.btn.night-on{background:var(--m1);color:var(--night);border-color:var(--m1)}
.btn.night-off{background:var(--night);color:var(--m1);border-color:var(--m2)}
.btn.night-off:hover{background:var(--m2);color:var(--night)}
.btn.light-pri{background:var(--night);color:#fff;border-color:var(--night)}
.btn.light-pri:hover{background:var(--hair);color:var(--night)}
.btn.light-sec{background:#fff;color:var(--night);border-color:var(--dusk)}
.btn.light-sec:hover{background:var(--hair)}
.pills{display:flex;gap:8px;height:100%}.pills .btn{flex:1 1 0;min-width:0}
/* the Definitions chip (P-7): a card with its own container fill, border and radius */
.chip{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:2px 12px 0}
/* tables: real tables, fixed column widths */
table.pbi{border-collapse:collapse;table-layout:fixed;width:100%;font-size:16px;line-height:1.33;color:var(--night)}
.pbi th{font-weight:400;color:var(--dusk);text-align:left;padding:0 5px;vertical-align:middle;box-shadow:inset 0 -1px 0 var(--dusk);white-space:normal}
.pbi td{padding:0 5px;vertical-align:middle}
.pbi .r{text-align:right}.pbi td.img{padding:0;line-height:0}
.pbi.rules td{box-shadow:inset 0 -1px 0 var(--hair)}
.pbi.wrap td{vertical-align:top;padding-top:6px;padding-bottom:6px}
.pbi .dusk{color:var(--dusk)}
.nums{display:flex;gap:12px}.nums>div{flex:1 1 0;min-width:0}
.nums .v{font-weight:600;color:var(--night);white-space:normal}.nums .v.neg{color:var(--burnt)}.nums .l{font-size:16px;color:var(--dusk)}
/* the build selector: a native button slicer, multi-select, square tiles, selection icon on */
.slicer{display:flex;flex-direction:column;height:100%}
.slicer button{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border:0;border-bottom:1px solid var(--hair);background:#fff;color:var(--night);font-size:16px;line-height:1.33;text-align:left;width:100%}
.slicer button:hover{background:var(--hair)}
.slicer .box{flex:0 0 16px;width:16px;height:16px;border:1px solid var(--dusk);border-radius:2px;display:flex;align-items:center;justify-content:center}
.slicer button[aria-pressed="true"] .box{background:var(--night);border-color:var(--night)}
.slicer .lab{min-width:0}
svg.chart{display:block;overflow:visible;font-family:var(--font)}
svg.chart text{font-size:16px}
.ctitle{font-size:18.667px;font-weight:600;color:var(--night);line-height:1.33;margin-bottom:4px}
/* overflow marks: red = more than 2 px beyond the slot, amber = within 2 px */
.ovf{outline:2px solid var(--ovf)!important;outline-offset:0}
.slots-on .tight{outline:2px dashed var(--tight)!important;outline-offset:0}
/* show slots */
.sb-box{position:absolute;border:1px dashed var(--slot);pointer-events:none;z-index:50}
.sb-box.moved{border:2px solid var(--moved)}
.sb-lab{position:absolute;left:-1px;top:-1px;background:var(--slot);color:#fff;font:600 12px/16px 'GI Text',Arial,sans-serif;padding:1px 4px;white-space:nowrap;border-radius:0 0 4px 0}
.sb-box.moved .sb-lab{background:var(--moved)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function mUSD(v) {               // '$9.4M'; two decimals only for a non-zero value that one decimal shows as 0.0
  const a = Math.abs(v) / 1e6;
  return '$' + (a > 0 && a < 0.05 ? a.toFixed(2) : r1(a).toFixed(1)) + 'M';
}

function pkg(ids) {
  const o = {ids, capex: ids.reduce((a, i) => a + P[i].capex, 0), npv:{}, rr:{}, cum:{}, pb:{}, yld:{}};
  for (const s of SCEN) {

    const k = o.cum[s].findIndex(v => v >= 0);
    o.pb[s] = k < 0 ? null : +YEARS[k];

  return o;
}

/* ===================================================================== copy helpers */
const T = (html, cls = '') => `<div class="c ${cls}">${html}</div>`;
const part = (top, h, inner) => `<div class="part" style="top:${top}px;height:${h}px">${inner}</div>`;
const kicker = (code, rest) => T(`<span class="code">${code}</span> · ${esc(rest)}`, 'kick');
const neg = v => (v < 0 ? ' neg' : '');

/* ===================================================================== SVG helpers */
const svgOpen = (w, h, cls = '') => `<svg class="chart ${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
function tx(x, y, s, o = {}) {
  const a = o.a || 'start', fill = o.fill || C.dusk, wt = o.w || 400, cls = o.cls || '', sz = o.size || 16;
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a}" dominant-baseline="central" fill="${fill}" font-size="${sz}" font-weight="${wt}" class="${cls}">${esc(s)}</text>`;
}
const ln = (x1, y1, x2, y2, stroke, sw = 1, dash = '') => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const path = (pts, stroke, sw, dash = '') => `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
const rect = (x, y, w, h, fill, extra = '') => `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(0, w).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" fill="${fill}" ${extra}/>`;
const _cv = document.createElement('canvas').getContext('2d');
const textW = (str, px = 16, wt = 400) => { _cv.font = `${wt} ${px}px ${getComputedStyle(document.body).getPropertyValue('--font')}`; return _cv.measureText(str).width; };
const mTick = t => (t < 0 ? MINUS : t > 0 ? '+' : '') + '$' + Math.abs(t) + 'M';
function niceTicks(min, max) {            // a native auto axis, always with a tick below zero (P-5)
  min = Math.min(min, 0); max = Math.max(max, 0);
  const span = (max - min) || 1, raw = span / 5, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= 6);
  let lo = Math.floor(min / step) * step; const hi = Math.ceil(max / step) * step;
  if (lo === 0) lo = -step;
  let hi2 = hi; if (hi2 === 0) hi2 = step;
  const t = []; for (let v = lo; v <= hi2 + 1e-9; v += step) t.push(+v.toFixed(6));
  return {lo, hi:hi2, ticks:t};
}

const y25 = b => DATA.brands[b].y2025;
const rankOf = (metric, desc) => { const v = BRANDS.map(b => y25(b)[metric]).sort((a, b) => desc ? b - a : a - b); return v.indexOf(GI.y2025[metric]) + 1; };
function kpi(code, label, value, ctx, ctxCls) {
  return part(0, 24, T(`<span class="code">${code}</span> · ${esc(label)}`, 'f16 dusk')) +
         part(24, 48, T(esc(value), 'kval')) +
         part(72, 24, T(esc(ctx), 'f16 ' + ctxCls));
}
R.kpi_occ = () => {
  const o = OTHERS.map(b => y25(b).occupancy), rk = rankOf('occupancy', true);
  return kpi('F4', 'Occupancy', pct1(GI.y2025.occupancy),
    `${rk === 1 ? 'best' : ord(rk)} of ${BRANDS.length}, the others ${pct1(Math.min(...o))} to ${pct1(Math.max(...o))}`, 'blue-t" style="color:var(--blue-t)');
};
R.kpi_margin = () => {
  const rk = rankOf('gop_margin_after', true), d = shownP(GI.y2025.gop_margin_after) - shownP(GI.y2023.gop_margin_after);
  return kpi('F1', 'Operating margin after commissions', pct1(GI.y2025.gop_margin_after),
    `${ord(rk)} of ${BRANDS.length}, ${s1(d)} pt since 2023`, 'neg');
};
R.kpi_ota = () => {
  const rk = rankOf('ota_share', true);
  return kpi('F2', 'Room revenue booked through online agencies', pct1(GI.y2025.ota_share),
    `${rk === 1 ? 'highest' : ord(rk)} of ${BRANDS.length}, ${pct1(GI.y2021.ota_share)} in 2021`, 'neg');
};
R.kpi_nps = () => {
  const ys = ['2021', '2022', '2023', '2024', '2025'].map(y => GI.trend[y].nps);
  const falling = ys.every((v, i) => !i || v < ys[i - 1]), rk = rankOf('nps', true);
  return kpi('F3', `Guest quality: net promoter score (${MINUS}100 to +100)`, s1(GI.y2025.nps),
    `${GI.y2025.nps > 0 ? 'still positive' : 'negative'}${falling ? ', but falling every year' : ''}, ${rk === BRANDS.length ? 'last' : ord(rk)} of ${BRANDS.length}`, 'neg');
};

// F1 the margin (4.2)
const F1 = (() => {
  const drop = shownP(GI.y2023.gop_margin_after) - shownP(GI.y2025.gop_margin_after);
  const comm = r1((GI.y2025.dist_pct_rev - GI.y2023.dist_pct_rev) * 100);
  const ops = r1((GI.y2023.gop_margin - GI.y2025.gop_margin) * 100);
  const adr = (GI.y2025.adr / GI.y2023.adr - 1);
  return {drop:r1(drop), comm, ops, adr};
})();
R.c_f1_kicker = () => kicker('F1', 'THE MARGIN');
R.c_f1_title = () => T(`After commissions, the margin fell ${F1.drop.toFixed(1)} points since 2023`, 'ttl');
R.c_f1_note = () => T(`Commissions took ${F1.comm.toFixed(1)} of those points and running costs ${F1.ops.toFixed(1)} (staff rose from ${E.staff[0]} to ${E.staff[1]} of revenue). Room rates rose ${pct1(F1.adr)}, in line with the other brands, so no price premium absorbs it.`, 'f16 dusk');

const TREND = ['2021', '2022', '2023', '2024', '2025'];
R.ch_f1_margin = () => {
  const w = 560, h = 248, x0 = 44, x1 = w - 150, y0 = 10, y1 = h - 30, band = (x1 - x0) / 5;
  const X = i => x0 + band * (i + 0.5), Y = v => y1 - (v - 0.30) / 0.20 * (y1 - y0);
  const after = TREND.map(y => GI.trend[y].gop_margin_after), before = TREND.map(y => GI.trend[y].gop_margin);
  let s = svgOpen(w, h);
  for (const t of [0.30, 0.35, 0.40, 0.45, 0.50]) { s += ln(x0, Y(t), x1, Y(t), C.hair); s += tx(x0 - 8, Y(t), pct0(t), {a:'end'}); }
  const poly = after.map((v, i) => [X(i), Y(v)]).concat(before.map((v, i) => [X(i), Y(v)]).reverse());
  s += `<polygon points="${poly.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="${C.grey}" fill-opacity="0.3"/>`;
  s += path(before.map((v, i) => [X(i), Y(v)]), C.grey, 2);
  s += path(after.map((v, i) => [X(i), Y(v)]), C.blue, 3);
  s += tx(x1 + 8, Y(after[4]), 'After commissions', {cls:'lbl'});
  s += tx(x1 + 8, Y(before[4]), 'Commissions', {cls:'lbl'});
  TREND.forEach((y, i) => (s += tx(X(i), y1 + 17, y, {a:'middle'})));
  return s + '</svg>';
};

// F2 the middleman (4.3)
const roomRev = (b, y) => DATA.brands[b].trend[y].dist_cost / DATA.brands[b].trend[y].dist_pct_room;
const sistersOTA = y => OTHERS.reduce((a, b) => a + DATA.brands[b].trend[y].ota_share * roomRev(b, y), 0) / OTHERS.reduce((a, b) => a + roomRev(b, y), 0);
const FOLIO = (() => {
  const o = DATA.folio['Online Travel Agencies'], d = DATA.folio['Direct Website & App'], c2 = v => Math.round(v * 100) / 100;
  const ro = {pay:c2(o.adr), fee:c2(o.dist)}, rd = {pay:c2(d.adr), fee:c2(d.dist)};
  ro.keep = c2(ro.pay - ro.fee); rd.keep = c2(rd.pay - rd.fee);         // parts rounded to add up
  return {o:ro, d:rd};
})();
const usd2 = v => (v < 0 ? MINUS : '') + '$' + Math.abs(v).toFixed(2);

  s += tx(x1 + 8, Y(si[4]), 'The other three brands', {cls:'lbl'});
  s += ln(x0, y1, x1, y1, C.hair);

};

function cumSVG(o) {
  // o: w, h, series [{vals, color, width, dash, label, labelColor, bold}], ticks {lo,hi,ticks}, gate (bool)
  const w = o.w, h = o.h, x0 = 72, x1 = w - (o.padR || 170), y0 = o.padT || 14, y1 = h - 28;
  const X = yr => x0 + (yr - 2027) / 5 * (x1 - x0), Y = v => y1 - (v - o.ticks.lo) / (o.ticks.hi - o.ticks.lo) * (y1 - y0);
  let s = svgOpen(w, h);
  for (const t of o.ticks.ticks) { if (t !== 0) s += ln(x0, Y(t), x1, Y(t), C.hair); s += tx(x0 - 8, Y(t), mTick(t), {a:'end'}); }
  s += ln(x0, Y(0), x1, Y(0), C.dusk);
  s += tx(x0 + 6, Y(0) - 12, 'Cash positive above this line', {cls:'lbl', fill:C.dusk});
  if (o.gate) { const gx = X(2028.5); s += ln(gx, y0, gx, y1, C.night, 1, '5 4'); s += tx(gx + 6, y0 + 8, 'The 2028 gate', {cls:'lbl', fill:C.night}); }
  for (const sr of o.series) s += path(sr.vals.map((v, i) => [X(2027 + i), Y(v / 1e6)]), sr.color, sr.width, sr.dash || '');
  for (const sr of o.series) if (sr.label) s += tx(x1 + 10, Y(sr.vals[5] / 1e6), sr.label, {cls:'lbl', fill:sr.labelColor || C.dusk, w:sr.bold ? 600 : 400});
  for (let yr = 2027; yr <= 2032; yr++) s += tx(X(yr), y1 + 16, String(yr), {a:'middle'});
  return s + '</svg>';
}

/* ===================================================================== overflow and collision check */
function check() {
  const out = [];
  stage.querySelectorAll('.s').forEach(el => {
    const name = el.dataset.name, s = SLOTS[PAGE[ST.page]][name];
    if (s.kind) return;
    const boxes = el.querySelectorAll(':scope > .part');
    const list = boxes.length ? [...boxes] : [el];
    for (const b of list) {
      const c = b.querySelector(':scope > .c, :scope > table, :scope > button, :scope > .pills, :scope > .slicer');
      if (!c) continue;
      const cs = getComputedStyle(b);
      const availH = b.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const availW = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      let dy, dx;
      if (c.tagName === 'BUTTON' || c.classList.contains('pills') || c.classList.contains('slicer')) {
        dy = 0; dx = 0;
        c.querySelectorAll('.c, .lab').forEach(l => {
          const box = l.closest('button');
          dy = Math.max(dy, l.offsetHeight - box.clientHeight); dx = Math.max(dx, l.scrollWidth - l.clientWidth, l.offsetWidth - box.clientWidth);
        });
        if (c.classList.contains('slicer')) dy = Math.max(dy, c.scrollHeight - b.clientHeight);
      } else if (c.classList.contains('ctitle')) {
        const lines = Math.round(c.offsetHeight / (18.667 * 1.33));
        dy = lines > 1 ? 1 : 0; dx = c.scrollWidth - availW;
      } else {
        dy = c.offsetHeight - availH; dx = c.scrollWidth - availW;
      }
      const over = Math.max(dx, dy);
      if (over > 2) { b.classList.add('ovf'); out.push({name, kind:'red', note:fmtOver(dx, dy, c)}); }
      else if (over > 0.5) { b.classList.add('tight'); out.push({name, kind:'amber', note:c.classList.contains('ctitle') ? 'title wraps to a second line' : fmtOver(dx, dy, c)}); }
    }
    el.querySelectorAll('svg.chart').forEach(svg => labels(svg, name, out));
  });
  return out;
}
function fmtOver(dx, dy, c) {
  const p = [];
  if (dy > 0.5) p.push(`${Math.round(dy)} px too tall`);
  if (dx > 0.5) p.push(`${Math.round(dx)} px too wide`);
  return p.join(', ');
}
function labels(svg, name, out) {
  const W = +svg.getAttribute('width'), H = +svg.getAttribute('height');
  const L = [...svg.querySelectorAll('text.lbl')].map(t => { const b = t.getBBox(); return {t, x:b.x, y:b.y + 3, w:b.width, h:b.height - 6}; });
  const bad = new Set(), notes = [];
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const a = L[i], b = L[j];
    if (a.x < b.x + b.w - 1 && b.x < a.x + a.w - 1 && a.y < b.y + b.h && b.y < a.y + a.h) { bad.add(a); bad.add(b); notes.push(`"${a.t.textContent}" / "${b.t.textContent}" collide`); }
  }
  for (const a of L) if (a.x < -0.5 || a.x + a.w > W + 0.5 || a.y < -0.5 - 3 || a.y + a.h > H + 3.5) { bad.add(a); notes.push(`"${a.t.textContent}" leaves the visual`); }
  if (!bad.size) return;
  let marks = '';
  for (const a of bad) marks += `<rect x="${(a.x - 2).toFixed(1)}" y="${(a.y - 4).toFixed(1)}" width="${(a.w + 4).toFixed(1)}" height="${(a.h + 8).toFixed(1)}" fill="none" stroke="#E5001C" stroke-width="2"/>`;
  svg.insertAdjacentHTML('beforeend', marks);
  out.push({name, kind:'red', note:[...new Set(notes)].join('; ')});
}

    for (const f of render()) {
      const k = `${pg === 'p1' ? 'P1' : 'P2'} ${f.name}`;
      (res[k] = res[k] || {kind:f.kind, items:[]}).items.push(label + ': ' + f.note);
      if (f.kind === 'red') res[k].kind = 'red';
    }
  }
  Object.assign(ST, keep);
  const reds = Object.entries(res).filter(([, v]) => v.kind === 'red'), ambs = Object.entries(res).filter(([, v]) => v.kind !== 'red');
  document.getElementById('auditSum').textContent = `Overflow check across all 12 views (4 screens × 3 scenarios): ${reds.length} slot${reds.length === 1 ? '' : 's'} red, ${ambs.length} tight`;
  const row = ([k, v]) => `<tr><td class="${v.kind === 'red' ? 'r' : 'a'}">${esc(k)}</td><td>${v.items.map(esc).join('<br>')}</td></tr>`;
  const moves = Object.entries(DOC21);
  document.getElementById('auditBody').innerHTML =
    `<p>Red: the text needs more than 2 px beyond its slot, or chart labels collide. Amber: within 2 px, or a visual title that wraps. Build views use the opening selection (package A's three moves).</p>` +
    (reds.length + ambs.length ? `<table><tr><th>Slot</th><th>Where, and by how much</th></tr>${reds.map(row).join('')}${ambs.map(row).join('')}</table>` : '<p>Nothing overflows.</p>') +
    `<h4>Slots changed against doc 21</h4>` + (moves.length ? `<table><tr><th>Slot</th><th>doc 21</th><th>v10</th><th>Why</th></tr>${moves.map(([k, m]) => `<tr><td>${esc(k.split('/')[1])}</td><td>${m.from.join(', ')}</td><td>${m.to.join(', ')}</td><td>${esc(m.why)}</td></tr>`).join('')}</table>` : '<p>None.</p>');
  return res;
}

/* ===================================================================== boot */
route();
scale();
const ready = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('16px "GI Text"'), document.fonts.load('600 16px "GI Text"')]).catch(() => null) : Promise.resolve();
ready.then(() => (document.fonts ? document.fonts.ready : null)).then(() => {
  window.__audit = audit();
  render();
  scale();
  window.__ready = true;
});
render();
window.__ST = ST; window.__go = go; window.__render = render; window.__SLOTS = SLOTS; window.__slotMap = slotMap;
})();
</script>
