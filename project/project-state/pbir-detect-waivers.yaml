# Waivers for scripts/pbir_detect.py (the PBIR taste-lint).
#
# ============================================================================
# STATUS: DRAFT - PREPARED BY pbir-operator 2026-08-05, AWAITING THE ENTRANT'S
# SIGN-OFF. A GATE MAY BE WAIVED ONLY BY THE USER.
#
# These entries are argued, not assumed. Nothing here is signed until the
# entrant says so in their own words; until then G6 stays HELD even though the
# detector reads PASS with this file in place. To sign: reply approving the
# entries below, and record the approval in status.yaml's s6 gate_note.
# To reject any single entry: delete it and the underlying finding comes back.
# ============================================================================
#
# A waiver is a recorded design decision, not an escape hatch: every entry
# MUST carry a non-empty reason (ideally naming the design handoff or user
# decision that sanctioned it) - reasonless waivers are rejected and waive
# nothing. Unwaived findings fail the G6/G7 gates.
#
# Format (miniyaml subset - mappings only, no list-of-mapping syntax):
#   waivers:
#     <short-name>:
#       rule: <rule id from `python scripts/pbir_detect.py --list-rules`>
#       path: <glob matched against the finding path, e.g. "pages/*" or
#              "pages/cover/visuals/dn_*/visual.json" or "report">
#       reason: "why this deviation is a decision, and who approved it"
#       date: YYYY-MM-DD
#
# ---------------------------------------------------------------------------
# WHAT WAS FIXED RATHER THAN WAIVED (2026-08-05, pbir-operator)
#
# All 63 findings were inspected individually before any waiver was drafted.
#
# 1. ai-dash-emoji: 46 hits read one by one against their own page's copy
#    register. FOUR were genuine AI writing tells - a spaced em-dash used as a
#    rhetorical pivot between two independent clauses, in lowercase prose, with
#    a dashless sibling string in the same register on the same page. Those
#    four were REWRITTEN, not waived:
#      z_ticket3_tease   "the fixes land - and one is refused"
#                        -> "the fixes land, and one is refused"
#                        (siblings z_ticket1/2_tease carry no punctuation)
#      c_p2_note_twenty  "no evidence floor - it never says how many voted."
#                        -> "no evidence floor. It never says how many voted."
#                        (sibling notes c_p1_note_budget / c_p2_note_twovotes
#                        are plain full-stop sentences)
#      c_lb_more         "then title - three of the perfect tens..."
#                        -> "then title; three of the perfect tens..."
#                        (sibling caption c_verdict_act1_note uses a semicolon)
#      c_tt_foot         "not published - ranked under protest"
#                        -> "not published. Ranked under protest"
#                        (its p3 twin c_refusal_why states the same two facts
#                        with a full stop)
#    The remaining 42 are the contracted register and are waived below.
#
# 2. theme-color-drift: all 11 hits were PROMOTED, not waived. The six chrome
#    hexes (#9A9284 #6E6960 #282331 #C8C3B4 #EBE7DC #8A8377) are now named
#    style presets in theme.json - ticketPerforation, parameterChip,
#    spotlightSurface, posterPlate, leaderboardRule, evidenceReference -
#    verified against reportThemeSchema-2.156.json (0 errors). A named preset
#    is inert unless a visual selects it, so nothing renders differently; the
#    visuals keep stating the colour explicitly, which .claude/rules/
#    pbir-style.md requires of every approved visual anyway. The theme is now
#    the single registry for the report's chrome palette. Zero drift findings
#    remain, so this file waives none.
#
# 3. grid-8px: 6 page-level findings, waived below with the honest reason.
# ---------------------------------------------------------------------------

