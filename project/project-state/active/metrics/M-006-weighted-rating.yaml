contract: metric
metric_id: "M-006"
name: "Rating (evidence-weighted)"
date: "2026-08-04"

definition:
  plain_language: "The responsible counterpart to Lie #2: each movie's rating pulled toward the global average in proportion to how few votes it has (Bayesian shrinkage, the public IMDb-style formula)."
  formula_in_words: "(votes / (votes + m)) times the movie's raw rating, plus (m / (votes + m)) times the global mean rating C; m is the reliability threshold, C the vote-count-weighted global mean."
  grain: "movie"
  filters: "report-wide Adult exclusion"
  unit: "score (0-10)"
  direction_is_good: "up"

edge_cases:
  - "m TO VERIFY (Q2): set to the 90th percentile of Vote Count (rounded to a communicable number) — the choice of m is an assumption and is DISCLOSED on-canvas ('we require roughly the evidence of the top decile')."
  - "C TO VERIFY (Q2): computed once, stated on the definities/method panel."
  - "Zero votes → shrinks fully to C — display as 'no evidence' rather than C, or it fabricates consensus."
  - "The raw-vs-weighted rank flip for a named small-sample film is Lie #2's money shot — pick the example from profiling, not memory (do-not-fabricate)."

targets: { exists: false, source: "n/a" }
owner: "entrant (definition steward)"
synonyms: "shrunk rating, weighted score, Bayesian rating"
conflicts_checked: true

implementation: { measure_name: "", display_folder: "", format_string: "" }
