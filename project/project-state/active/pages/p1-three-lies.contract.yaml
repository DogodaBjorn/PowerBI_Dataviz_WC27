contract: page-purpose
page_id: "p1-three-lies"
page_name: "The Three Lies"
date: "2026-08-04"

audience: "A1"
question: "Where does this dataset seduce a naive reader, and what is the honest read of each seduction?"
archetype: "overview"

three_second_message: "The data is not wrong — the reading is: three seductive lies, each struck through, each answered by an honest number that states what it excludes."
three_minute_path: "Each lie pairs a trap-marked exhibit (strike + TRAP tag, mechanism stated) with its honest counterpart carrying disclosed assumptions on-canvas (floor $10k, m=100, C=6.96); corrections in words under each pair; footer scope stamp (snapshot 2026-07-24, Adult excluded 1,358, listings not films — 2.0% dup pairs); one button to p3-method for definitions and refusals."

hero: "hero_takeaway — the mandated Key Takeaway statement; it earns the position because it IS the entry's claim, and the three lie-pairs below are its proof."
supporting_visuals:
  - id: "kpi_profit_naive"
    intent: "1 Magnitude (trap exhibit — struck through, never a finding)"
    metric_ids: ["M-003", "M-002"]
  - id: "ch_coverage_waffle"
    intent: "5 Part-to-whole (felt proportion: 13.1% credible)"
    metric_ids: ["M-002", "M-001", "M-004"]
  - id: "tbl_perfect_tens"
    intent: "4 Ranking (trap exhibit — the false leaderboard)"
    metric_ids: ["M-005", "M-001"]
  - id: "ch_votes_vs_rating"
    intent: "7 Correlation (evidence vs score; form varies by direction — D1/D2 scatter, D3 dumbbell — intent constant)"
    metric_ids: ["M-005", "M-006"]
  - id: "c_lie3_trap"
    intent: "1 Magnitude (trap exhibit — the undefined number)"
    metric_ids: ["M-007"]
  - id: "ch_rank_divergence"
    intent: "4 Ranking (same films, three rankings diverge)"
    metric_ids: ["M-007", "M-006"]
  - id: "c_lie1_correction / c_lie2_correction / c_lie3_correction"
    intent: "annotation (S2 — the correction sentence per lie)"
    metric_ids: ["M-004", "M-006", "M-007"]

interactions: "btn_method (to p3), btn_timeline (to p2); report-level Adult=FALSE filter visible in the filter pane and LOCKED (static copy stays in sync with visuals); no slicers, no essential hover content."
leaves_out: "Genre/company breakdowns, any Popularity aggregation, per-lie detail pages, tooltips carrying story content, mean profit as a headline (it appears only as outlier-drag evidence beside the median)."
