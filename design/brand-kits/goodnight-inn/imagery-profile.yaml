# Imagery profile: Goodnight Inn (imagery-studio module).
# Sits beside brand.yaml. Governs generative chrome imagery only; the data
# area never carries imagery (hard rule 6). Under the contest rules every
# image must be our own, embedded, and free of bar, alcohol or political
# content; renders go through the user's choice of 2-3 candidates (im-imagery).

kit: "goodnight-inn"
version: 1
date: "2026-11-06"

method: generative

style_spec: >-
  Flat vector illustration with a slight paper grain, two-tone: night navy
  shapes on warm paper, one small amber highlight. Recurring motifs: a
  low roadside inn at dusk, a single lit window, a crescent moon, a key on
  a wooden fob, a folded bedsheet, a motorway or airport runway line on the
  horizon. Quiet and plain-spoken; the mood of arriving late and finding
  the light on.

palette:
  dominant: color.canvas
  ink: color.ink
  accent: color.accent
  support:
    - color.neutral_data

negative: >-
  no stock photo, no photorealism, no 3D render, no gradients, no neon, no
  glossy luxury hotel, no people's faces, no bar or drinks, no busy
  background, no more than one amber element per image

style_anchors:
  # The logo family is the only anchor until the first approved render;
  # add the chosen cover render here as anchor 2 so later images stay on-brand.
  - "design/brand-kits/goodnight-inn/assets/goodnight-inn-lockup.svg"

sizes:
  cover_hero:
    width: 3840
    height: 2160
    aspect_ratio: "16:9"
  section_divider:
    width: 3840
    height: 1620
    aspect_ratio: "21:9"
  background_texture:
    width: 3840
    height: 2160
    aspect_ratio: "16:9"
    note: "paper grain only, far below data-ink contrast; canvas is 1920x1080"
  empty_state:
    width: 1024
    height: 1024
    aspect_ratio: "1:1"
