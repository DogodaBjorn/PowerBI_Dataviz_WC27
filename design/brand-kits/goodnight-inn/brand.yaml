# Brand kit: Goodnight Inn (fictional budget/economy hotel brand from the Power BI
# Dataviz World Champs 2027 Round 1 dataset). Built from scratch on 2026-11-06 by
# the bk-brand-kit procedure: the dataset carries no brand assets, so every color,
# type choice and the logo are original work licensable to Microsoft under the
# contest rules. Design roles, not favorites; the look answers the D1 "Wake-up
# call" direction (paper, night-navy ink, one lamp-amber accent) and the canon
# audit in project-state/active/00-best-in-class-audit.md (items 2, 5, 10).
#
# Validation 2026-11-06 (scripts/check_contrast.py --kit, plus a Machado-matrix
# color-blindness simulation and CIE76 distances, scratch script):
#   ink/canvas 13.5  ink/surface 14.9  ink_secondary/canvas 6.2
#   accent/canvas 5.0  accent/surface 5.5  white-on-accent 5.6  (AA text: pass)
#   good/canvas 8.8   bad/canvas 5.2   good-vs-bad luminance ratio 1.7,
#   deltaE protan 33 / deutan 54 / tritan 94 (distinct, never the only carrier)
#   neutral_data/canvas 3.3 (non-text floor: pass)
#   categorical slots 1-4 pairwise deltaE >= 24 normal, >= 13 protan, >= 10 deutan,
#   >= 10 tritan, all >= 3.3:1 on canvas. Slots 5-6 are context greys BELOW the
#   3:1 floor by design (accepted): they carry labelled context series only.
#   hairline 1.3:1 (accepted: dividers are not meaning carriers).
# Publish-to-Web rule: built-in fonts only, embedded images only. Fonts here
# exist on both Windows and macOS so a Mac judge sees the same metrics.

kit: "goodnight-inn"
version: 1
date: "2026-11-06"

identity:
  organization_alias: "Goodnight Inn"
  personality: "plain-spoken, warm, rested"
  # Must never radiate: luxury-glossy, corporate-cold, cluttered.
  # Readers: a hotel-group Board and contest judges, on 1920-wide monitors and
  # 1366-wide laptops, in a browser under Publish-to-Web, possibly on macOS.

color:
  # Core surfaces and text: warm paper at night, navy ink. Never pure white canvas.
  canvas: "#F6F1E7"          # Paper: warm, low-glare; the bedsheet, not the lobby
  surface: "#FFFCF6"         # Linen: cards and the folio; one step lighter than canvas
  ink: "#1B2638"             # Night: primary text, near-black navy, never #000000
  ink_secondary: "#4E5A6E"   # Dusk: labels, captions, axis text (6.2:1)
  hairline: "#DED6C6"        # Fold: borders and rules; a crease in the paper

  # Meaning-bearing colors
  accent: "#9E5407"          # Lamp (ink weight): THE focal color for text, titles,
                             # the story series, the lit pane in the logo. 5.0:1 on canvas.
                             # Marks and fills may use the lighter Lamp #C2690A (3.5:1,
                             # non-text only); never for text, never both on one visual.
  good: "#134B41"            # Pine: direction-is-good; dark teal, not green
  bad: "#B3402E"             # Brick: direction-is-bad; warm red-brown, lighter than Pine
                             # so the pair separates by lightness as well as hue.
                             # Both always paired with a sign, arrow or word (hard rule 3).
  neutral_data: "#7D8590"    # Slate: context series and sister-brand benchmarks (3.3:1)

  # Categorical ramp, assignment order, max 6. The story series takes slot 1;
  # everything that is context goes grey (canon DC-037). Slots 5-6 are labelled
  # context fills only, below 3:1 on purpose.
  categorical:
    - "#9E5407"              # Lamp: the story series (OTA, the recommended plan)
    - "#2F4470"              # Navy: the brand's own series (direct web, the Board's own)
    - "#134B41"              # Pine: a third live series only when it must exist
    - "#7D8590"              # Slate: context
    - "#A9B0BA"              # Mist: context fill, labelled (2.0:1, accepted)
    - "#C9C1B2"              # Sand: background series, labelled (1.5:1, accepted)

  # Lamp ramp for heat encodings (occupancy by hotel and month, renovation age)
  sequential: ["#F1DDBE", "#DDB17A", "#C2690A", "#9E5407", "#5E3204"]
  # Brick to Pine through paper-grey; the midpoint is light grey, not white (Muth)
  diverging: ["#B3402E", "#D9A28F", "#D9D4CB", "#7FA9A0", "#134B41"]

typography:
  # Every family exists on Windows AND macOS, so a judge on a Mac sees the same
  # metrics under Publish-to-Web. Georgia carries words only: its old-style
  # figures (descending 3, 4, 5, 7, 9) misalign in tables and cards, so every
  # number is set in Segoe UI with Arial as the metric-close fallback.
  display: "Georgia, Georgia"                 # page titles, insight headlines, the wordmark
  body: "Segoe UI, Arial"                     # labels, axes, captions, table text
  numeric: "Segoe UI Semibold, Arial"         # every figure; lining, tabular by default
  scale_pt: [28, 20, 14, 12, 10]              # hero / page title / section / body / caption
  # 1920x1080 canvas: body never below 12 pt, captions never below 10 pt, so the
  # 1366-wide laptop test still reads at roughly 8.5 / 7 pt.

shape:
  radius_px: 4               # a folio corner, not a phone app; one radius report-wide
  shadow: "none"             # paper has no shadow; depth comes from the hairline
  hairline_px: 1

grid:
  base_px: 8
  page_margin_px: 32         # 1920-wide canvas; 24 at 1280
  gutter_px: 16

assets:
  logo: "assets/goodnight-inn-lockup.svg"
  # Variants: goodnight-inn-mark.svg (tile only), goodnight-inn-lockup-reversed.svg
  # (Linen wordmark on Night for dark chrome), goodnight-inn-mark-mono.svg
  # (single-color Night, for favicon-size and print). PNG exports at 2x beside
  # each SVG for Power BI image visuals (embedded images only).
  usage: "chrome only: masthead top-left on both pages, the overlay header, the gallery thumbnail; never inside a chart, never as a watermark, never recolored outside the three variants"

voice:
  title_style: "insight sentences"
  number_format_notes: "English (contest language): thousands with a comma, currency as $ before the figure with M for millions ($51.3M), one decimal discipline per visual, percentages with one decimal, negative values with a true minus sign, never parentheses"

forbidden:
  - "pure white canvas or pure black text"
  - "the lighter Lamp #C2690A as text, or both Lamp weights on one visual"
  - "a second accent hue (the navy series is the brand's own, never emphasis)"
  - "green for good: Pine is teal, and good/bad never stand without a sign or word"
  - "Georgia for any number"
  - "fonts outside Georgia, Segoe UI and Arial (Publish-to-Web, macOS judges)"
  - "gradients, shadows, glassmorphism, decorative imagery inside the data area"
  - "the logo inside a chart or as a background watermark"
  - "bar, alcohol or political imagery anywhere in the chrome (contest rules)"
