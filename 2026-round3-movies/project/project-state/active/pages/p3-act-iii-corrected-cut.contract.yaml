page_name: "Act III — The Corrected Cut"
date: "2026-08-04"

audience: "A1"
question: "With the adjustments applied — and one refused — which films actually earn 'best', and how does that evolve by release year?"
archetype: "comparison"

three_second_message: "Adjust honestly (floor $10k, m=100, C=6.96), refuse what can't be defined (popularity), and the truly best-selling AND best-rated films emerge — year by year."
three_minute_path: "Adjustment chips restate every disclosed parameter; the refusal card serves M-007 (ranked under protest, never colored, never averaged, formula not published); the scatter axes are labeled (Revenue log X, Rating evidence-weighted Y, C=6.96 reference line), population defined on-canvas (credible financials AND votes ≥ 100, n = PLACEHOLDER-AT-BUILD); the no-date chip counts the 26,166 excluded from the play axis; winner annotated PLACEHOLDER-AT-BUILD; credits one click away."

hero: "hero_premiere_scatter — NATIVE scatter with play axis over Release Year (the entrant's animation, a core PBI visual); default = final resolved state, play is enhancement."
supporting_visuals:
  - id: "c_adjustments"
    intent: "annotation (disclosed parameters as chips)"
    metric_ids: ["M-002", "M-004", "M-006"]
  - id: "c_refusal_popularity"
    intent: "4 Ranking (mini rank-divergence, 3 films PLACEHOLDER-AT-BUILD) + refusal statement"
    metric_ids: ["M-007", "M-006"]
  - id: "c_nodate_chip"
    intent: "1 Magnitude (the labeled unknown: 26,166 / 30.6%; 320 future-dated; sentinels 1800/2099 excluded from play)"
    metric_ids: ["M-001"]
  - id: "c_verdict_act3"
    intent: "editorial framing (S1 — 'THE END')"
    metric_ids: ["M-004", "M-006"]

interactions: "Beat rail (bm_p3_b1 adjustments / b2 refusal / b3 premiere), DEFAULT = SC.3 (ack); scatter points → tt-movie-poster; play axis default position = latest year (nothing essential in motion); btn_credits → p9; btn_home → p0."
